name: Deploy to GitHub Pages

# Builds and publishes the frontend on every push to main. The backend is not
# deployed here: GitHub Pages serves static files only and cannot run Python.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck runs as part of build, so a type error fails the deploy.
      - run: npm run build
        env:
          # Point at a deployed backend here if you have one. Unset means the
          # Stems panel shows "Backend offline" and everything else works.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
